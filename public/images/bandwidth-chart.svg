<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="頻寬成長抽象圖表">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="g7" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="600" fill="url(#bg7)"/>

  <g stroke="#334155">
    <path d="M120 460 H800"/>
  </g>

  <g fill="url(#bar)">
    <rect x="150" y="380" width="60" height="80" rx="4"/>
    <rect x="250" y="330" width="60" height="130" rx="4"/>
    <rect x="350" y="270" width="60" height="190" rx="4"/>
    <rect x="450" y="200" width="60" height="260" rx="4"/>
    <rect x="550" y="150" width="60" height="310" rx="4"/>
    <rect x="650" y="100" width="60" height="360" rx="4"/>
  </g>

  <path d="M180 375 L280 325 L380 265 L480 195 L580 145 L680 95" stroke="#a78bfa" stroke-width="3" fill="none" filter="url(#g7)"/>
  <g fill="#c4b5fd">
    <circle cx="180" cy="375" r="4"/>
    <circle cx="280" cy="325" r="4"/>
    <circle cx="380" cy="265" r="4"/>
    <circle cx="480" cy="195" r="4"/>
    <circle cx="580" cy="145" r="4"/>
    <circle cx="680" cy="95" r="4"/>
  </g>

  <g fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <text x="180" y="485">100G</text>
    <text x="280" y="485">200G</text>
    <text x="380" y="485">400G</text>
    <text x="480" y="485">800G</text>
    <text x="580" y="485">1.6T</text>
    <text x="680" y="485">3.2T</text>
  </g>

  <text x="450" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1">單埠速率世代演進趨勢示意</text>
</svg>
