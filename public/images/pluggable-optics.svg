<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="傳統可插拔光模組架構示意圖">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="g2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="600" fill="url(#bg2)"/>

  <!-- ASIC 位於左側 -->
  <rect x="90" y="255" width="150" height="90" rx="10" fill="#111827" stroke="#475569" stroke-width="1.5"/>
  <text x="165" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">ASIC</text>

  <!-- 長距離 PCB 走線 -->
  <path d="M240 300 H620" stroke="url(#trace)" stroke-width="4" stroke-dasharray="10 6" filter="url(#g2)"/>
  <g opacity="0.7">
    <circle cx="330" cy="300" r="3" fill="#fbbf24"/>
    <circle cx="430" cy="300" r="3" fill="#fbbf24"/>
    <circle cx="530" cy="300" r="3" fill="#fbbf24"/>
  </g>

  <!-- 前面板 -->
  <rect x="700" y="120" width="14" height="360" fill="#1e293b" stroke="#334155"/>
  <text x="707" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">前面板</text>

  <!-- 可插拔模組 -->
  <rect x="625" y="265" width="70" height="70" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="660" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24">模組</text>

  <!-- 出光 -->
  <path d="M714 300 h90" stroke="#fbbf24" stroke-width="3" opacity="0.6" filter="url(#g2)"/>

  <text x="450" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1">較長電氣路徑 · 訊號衰減與功耗較高</text>
</svg>
