<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="晶片封裝散熱示意橫幅">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="g8" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bg8)"/>

  <!-- 封裝疊層側視圖 -->
  <g transform="translate(430,80)">
    <rect x="0" y="140" width="340" height="26" fill="#111827" stroke="#334155"/>
    <text x="170" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">基板 Substrate</text>

    <rect x="40" y="100" width="120" height="40" fill="#1e293b" stroke="#475569"/>
    <text x="100" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">ASIC Die</text>

    <rect x="190" y="100" width="110" height="40" fill="#0b1220" stroke="#22d3ee"/>
    <text x="245" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#67e8f9">光引擎</text>

    <rect x="20" y="60" width="300" height="40" fill="#0f172a" stroke="#334155" opacity="0.9"/>
    <text x="170" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">均熱片 Lid</text>
  </g>

  <!-- 熱擴散光暈 -->
  <g filter="url(#g8)">
    <rect x="470" y="10" width="260" height="60" fill="url(#heat)"/>
  </g>

  <text x="600" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#cbd5e1">共封裝結構下的散熱與功耗管理挑戰</text>
</svg>
