<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="共同封裝光學晶片示意圖">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#111c34"/>
      <stop offset="55%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="beamCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g opacity="0.18" stroke="#38bdf8" stroke-width="1">
    <path d="M0 750 L1200 750"/>
    <path d="M0 800 L1200 800"/>
    <path d="M0 850 L1200 850"/>
  </g>
  <g opacity="0.35">
    <circle cx="180" cy="150" r="1.6" fill="#93c5fd"/>
    <circle cx="960" cy="120" r="1.6" fill="#c4b5fd"/>
    <circle cx="1040" cy="620" r="1.6" fill="#67e8f9"/>
    <circle cx="120" cy="560" r="1.6" fill="#93c5fd"/>
    <circle cx="620" cy="90" r="1.6" fill="#67e8f9"/>
  </g>

  <ellipse cx="600" cy="460" rx="360" ry="230" fill="#1d4ed8" opacity="0.18" filter="url(#softGlow)"/>
  <ellipse cx="600" cy="460" rx="220" ry="150" fill="#7c3aed" opacity="0.16" filter="url(#softGlow)"/>

  <rect x="380" y="360" width="440" height="200" rx="18" fill="url(#chip)" stroke="#334155" stroke-width="2"/>
  <rect x="470" y="405" width="150" height="110" rx="10" fill="#0b1220" stroke="#475569" stroke-width="1.5"/>
  <text x="545" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#94a3b8">Switch ASIC</text>
  <rect x="650" y="405" width="90" height="45" rx="8" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="695" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#67e8f9">Optical</text>
  <rect x="650" y="470" width="90" height="45" rx="8" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="695" y="497" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#67e8f9">Engine</text>

  <g filter="url(#glow)">
    <path d="M745 425 C 900 380, 1000 300, 1150 220" stroke="url(#beamCyan)" stroke-width="3" fill="none"/>
    <path d="M745 490 C 900 540, 1020 600, 1170 660" stroke="url(#beamCyan)" stroke-width="3" fill="none"/>
    <path d="M745 455 C 920 460, 1030 460, 1170 460" stroke="url(#beamViolet)" stroke-width="2.5" fill="none"/>
    <path d="M380 420 C 230 370, 140 300, 40 230" stroke="url(#beamViolet)" stroke-width="2.5" fill="none" transform="scale(-1,1) translate(-1200,0)"/>
  </g>

  <circle cx="1150" cy="220" r="4" fill="#67e8f9" filter="url(#glow)"/>
  <circle cx="1170" cy="660" r="4" fill="#67e8f9" filter="url(#glow)"/>
  <circle cx="1170" cy="460" r="4" fill="#c4b5fd" filter="url(#glow)"/>

  <g stroke="#475569" stroke-width="1" opacity="0.6">
    <path d="M400 380 h420" />
    <path d="M400 540 h420" />
  </g>
</svg>
